[tools]
go = "1.27.1"
"aqua:golangci/golangci-lint" = "2.14.0"
"conda:clang" = "23.1.2"
"conda:pkg-config" = "0.29.2"
"conda:libopus" = "1.6.1"

[env]
CC = "clang"
CGO_ENABLED = "1"
PKG_CONFIG_PATH = { value = "{{ tools['conda:libopus'].path }}/lib/pkgconfig", tools = true }
CGO_LDFLAGS = { value = "-Wl,-rpath,{{ tools['conda:libopus'].path }}/lib", tools = true }

[tasks.build]
description = "Build the app"
sources = ["**/*.go", "go.mod", "go.sum", ".mise.toml"]
outputs = ["bin/voice"]
run = "go build -o bin/voice ./cmd/voice"

[tasks.start]
description = "Build and run the app"
depends = ["build"]
run = "./bin/voice"

[tasks.fmt]
description = "Format Go code and imports"
run = "golangci-lint fmt ./..."

[tasks.lint]
description = "Check Go code and formatting"
run = "golangci-lint run ./..."

[tasks."lint:fix"]
description = "Apply lint fixes and format Go code"
run = "golangci-lint run --fix ./..."
